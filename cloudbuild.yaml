# Optional. Trustle mirrors every main build into its own registry with Google Cloud Build.
# The public release path is .github/workflows/release.yml. Ignore this file if you do not use
# Cloud Build.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag=us.gcr.io/trustle-core-cicd/dbos-version-controller:$SHORT_SHA
      - .

images:
  - us.gcr.io/trustle-core-cicd/dbos-version-controller:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
