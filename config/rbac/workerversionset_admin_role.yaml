# This rule is not used by the project dbos-version-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over dbos.trustle.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dbos-version-controller
    app.kubernetes.io/managed-by: kustomize
  name: workerversionset-admin-role
rules:
- apiGroups:
  - dbos.trustle.com
  resources:
  - workerversionsets
  verbs:
  - '*'
- apiGroups:
  - dbos.trustle.com
  resources:
  - workerversionsets/status
  verbs:
  - get
