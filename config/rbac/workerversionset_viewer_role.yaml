# This rule is not used by the project dbos-version-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to dbos.trustle.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dbos-version-controller
    app.kubernetes.io/managed-by: kustomize
  name: workerversionset-viewer-role
rules:
- apiGroups:
  - dbos.trustle.com
  resources:
  - workerversionsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dbos.trustle.com
  resources:
  - workerversionsets/status
  verbs:
  - get
