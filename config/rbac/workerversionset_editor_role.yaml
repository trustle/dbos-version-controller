# This rule is not used by the project dbos-version-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the dbos.trustle.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dbos-version-controller
    app.kubernetes.io/managed-by: kustomize
  name: workerversionset-editor-role
rules:
- apiGroups:
  - dbos.trustle.com
  resources:
  - workerversionsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dbos.trustle.com
  resources:
  - workerversionsets/status
  verbs:
  - get
