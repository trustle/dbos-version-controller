name: E2E

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The suite builds the image, starts a Postgres and waits out a grace period. It is slower
    # than the unit job, so it is bounded rather than left to the six-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The suite installs the controller with the Helm chart.
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4

      # make test-e2e creates the kind cluster itself, with the kind version pinned in the
      # Makefile, so a local run and this job use the same one.
      - name: Run the e2e suite on kind
        run: make test-e2e
