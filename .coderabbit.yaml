# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for dbos-version-controller: concise, impact-first
# findings.
tone_instructions: "Be concise and specific. For each issue, state the concrete impact and a suggested fix, and cite file:line. Don't restate the diff or add praise. Flag uncertainty instead of guessing."

reviews:
  profile: assertive
  poem: false
  auto_review:
    auto_incremental_review: true
  path_filters:
    - "!go.sum"
    - "!**/zz_generated.*.go" # controller-gen output
    - "!config/crd/bases/**" # controller-gen output; review the Go types instead
    - "!crd/**" # verbatim copy of config/crd/bases for chart consumers
  path_instructions:
    - path: "**/*.go"
      instructions: >-
        Kubernetes controller built with kubebuilder / controller-runtime. The
        controller must never delete a worker version unless three gates hold:
        zero outstanding DBOS rows, zero pods, and the grace period. Treat any
        change that weakens a gate, adds an ownerReference, or lets a template
        override an ownership label as a correctness bug. Dry run may write
        only status and the drained-since marker. Prefer the API server's
        schema validation over re-validating in Go; flag names specific to one
        deployment (a company, a service or an environment) leaking into code
        or defaults.
