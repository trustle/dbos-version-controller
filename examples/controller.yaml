# A namespaced install of the controller: ServiceAccount, Role, RoleBinding and Deployment.
#
# `make deploy` installs the kubebuilder layout under config/ instead, which is cluster-scoped and
# carries the metrics service and the network policies. This file is the smaller alternative, and
# the shape the Helm chart mirrors. The rules match config/rbac/role.yaml, narrowed to one
# namespace.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dbos-version-controller
  namespace: dbos-workers
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dbos-version-controller
  namespace: dbos-workers
rules:
  - apiGroups: ["dbos.trustle.com"]
    resources: ["workerversionsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dbos.trustle.com"]
    resources: ["workerversionsets/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dbos-version-controller
  namespace: dbos-workers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dbos-version-controller
subjects:
  - kind: ServiceAccount
    name: dbos-version-controller
    namespace: dbos-workers
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbos-version-controller
  namespace: dbos-workers
  labels:
    app.kubernetes.io/name: dbos-version-controller
spec:
  replicas: 1
  # Never run two. A second controller reconciles the same desired state and
  # fights the first one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dbos-version-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dbos-version-controller
    spec:
      serviceAccountName: dbos-version-controller
      securityContext:
        runAsNonRoot: true
      containers:
        - name: controller
          image: ghcr.io/trustle/dbos-version-controller:0.4.0
          # The image is distroless. It carries no shell, so every setting arrives as an
          # environment variable or a flag, never through a shell command.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DVC_NAMESPACE
              value: dbos-workers
            - name: DVC_INTERVAL_SECONDS
              value: "30"
            - name: DVC_GRACE_SECONDS
              value: "600"
            - name: DVC_DRY_RUN
              value: "false"
            - name: DVC_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: dbos-database
                  key: system-database-url
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
