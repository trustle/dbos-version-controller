{{- with .Values.databaseUrl.externalSecret }}
{{- if .enabled }}
apiVersion: {{ .apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ required "databaseUrl.secretName is required" $.Values.databaseUrl.secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "dvc.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    kind: {{ .secretStoreRef.kind }}
    name: {{ required "databaseUrl.externalSecret.secretStoreRef.name is required" .secretStoreRef.name }}
  target:
    name: {{ $.Values.databaseUrl.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ $.Values.databaseUrl.secretKey }}
      remoteRef:
        key: {{ required "databaseUrl.externalSecret.remoteKey is required" .remoteKey }}
        conversionStrategy: Default
        decodingStrategy: None
{{- end }}
{{- end }}
