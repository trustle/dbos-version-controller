# The desired state of one DBOS application's worker versions.
#
# Git holds one WorkerVersionSet per application. The controller owns every
# per-version Deployment, ScaledObject and PDB the set covers, and reports what
# it found on .status.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workerversionsets.dbos.trustle.com
spec:
  group: dbos.trustle.com
  scope: Namespaced
  names:
    kind: WorkerVersionSet
    listKind: WorkerVersionSetList
    plural: workerversionsets
    singular: workerversionset
    shortNames:
      - wvs
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: One DBOS application's desired worker version and the manifests that render it.
          properties:
            spec:
              type: object
              required:
                - version
                - image
                - template
              properties:
                version:
                  type: string
                  description: >-
                    The desired DBOS application version. The pattern admits no quote character,
                    because the version is inlined into a KEDA query string.
                  pattern: '^[a-z0-9][a-z0-9.-]{0,48}$'
                image:
                  type: string
                  description: The worker image the desired version runs.
                  pattern: '^[A-Za-z0-9./:_@-]+$'
                graceSeconds:
                  type: integer
                  minimum: 0
                  description: >-
                    Seconds a drained version stays at zero rows and zero pods before it is
                    deleted. Defaults to the controller's DVC_GRACE_SECONDS.
                template:
                  type: object
                  description: >-
                    The three manifests, each a YAML string carrying the literal __VERSION__ and
                    __IMAGE__ placeholders. All three must share one metadata.name.
                  required:
                    - deployment
                    - scaledObject
                    - podDisruptionBudget
                  properties:
                    deployment:
                      type: string
                      description: The worker Deployment manifest.
                    scaledObject:
                      type: string
                      description: The KEDA ScaledObject manifest. Its first trigger seeds the drain trigger.
                    podDisruptionBudget:
                      type: string
                      description: The PodDisruptionBudget manifest.
            status:
              type: object
              description: What the controller saw on its last reconcile of this set.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                  description: The .metadata.generation the last reconcile read.
                lastReconcileTime:
                  type: string
                  format: date-time
                  description: When the controller last reconciled this set.
                versions:
                  type: array
                  description: One entry per live version of this set, the desired version first.
                  items:
                    type: object
                    required:
                      - version
                      - phase
                    properties:
                      version:
                        type: string
                        description: The DBOS application version.
                      phase:
                        type: string
                        description: >-
                          Current is the desired version. Draining is an old version KEDA holds at
                          zero. Drained is an old version at zero rows and zero pods, serving its
                          grace period.
                        enum:
                          - Current
                          - Draining
                          - Drained
                      image:
                        type: string
                        description: The image of the version's first worker container.
                      outstanding:
                        type: integer
                        format: int64
                        description: >-
                          ENQUEUED plus PENDING workflow rows of this version. Absent when the
                          database was unreachable.
                      replicas:
                        type: integer
                        format: int32
                        description: The Deployment's .status.replicas.
                      drainedSince:
                        type: string
                        format: date-time
                        description: When the version reached zero. Present only while Drained.
                conditions:
                  type: array
                  description: The Ready condition of the last reconcile.
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - reason
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                        maxLength: 316
                        pattern: '^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$'
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: '^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$'
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      lastTransitionTime:
                        type: string
                        format: date-time
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
